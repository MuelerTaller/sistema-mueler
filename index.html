<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mueler Taller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@9.8.1/dist/index.iife.js"></script>
<style>
/* Layout: misma barra de taller que el Optimizador; lista de presupuestos → editor del presupuesto (muebles a la izquierda/arriba, detalle del mueble + panel de resultado fijo a la derecha) */
:root{
  --bg:#eef0ec; --panel:#ffffff; --panel2:#f6f7f4; --ink:#1b211e; --muted:#5f6a64; --line:#d5dad3;
  --accent:#e8a400; --accent-soft:#fbefd0; --accent-ink:#1b1606; --focus:#1f5fd1;
  --t1:#d62828; --t2:#1f5fd1; --ok:#2d7a4b; --warn:#b36b00; --err:#c0392b;
  --board:#fbfbf9; --piece:#e3e9df; --piece-line:#7d8a80; --bar:#1b211e; --bar-ink:#eef0ec;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif; --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141816; --panel:#1c211e; --panel2:#222824; --ink:#e7ebe6; --muted:#9aa59e; --line:#333b36;
  --accent:#f0b429; --accent-soft:#3a3018; --accent-ink:#1b1606; --focus:#6ea0ff; --t1:#ff5a5a; --t2:#6ea0ff; --ok:#5fc98a; --warn:#f0b429; --err:#ff6b5e;
  --board:#242a26; --piece:#2f3a33; --piece-line:#7f8c84; --bar:#0b0e0c; --bar-ink:#e7ebe6; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141816; --panel:#1c211e; --panel2:#222824; --ink:#e7ebe6; --muted:#9aa59e; --line:#333b36;
  --accent:#f0b429; --accent-soft:#3a3018; --accent-ink:#1b1606; --focus:#6ea0ff; --t1:#ff5a5a; --t2:#6ea0ff; --ok:#5fc98a; --warn:#f0b429; --err:#ff6b5e;
  --board:#242a26; --piece:#2f3a33; --piece-line:#7f8c84; --bar:#0b0e0c; --bar-ink:#e7ebe6; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink)}
header.bar .in{max-width:1360px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;display:flex;align-items:baseline;gap:8px}
.brand small{font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs button{background:none;border:0;color:inherit;opacity:.7;font:600 13px var(--f-body);padding:7px 10px;border-radius:4px;cursor:pointer}
nav.tabs button[aria-selected="true"]{opacity:1;background:rgba(255,255,255,.12);box-shadow:inset 0 -2px 0 var(--accent)}
nav.tabs button:disabled{opacity:.35;cursor:default}
.bar .spacer{flex:1}
.savest{font:500 12px var(--f-mono);opacity:.75}
.btn{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:var(--r);cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--muted)} .btn:disabled{opacity:.5;cursor:not-allowed}
.bar .btn{background:transparent;color:var(--bar-ink);border-color:rgba(255,255,255,.22)}
.btn.primary,.bar .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)} .btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--err)} .btn.sm{padding:4px 8px;font-size:12px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:18px;font-weight:700} h3{font-size:14px;font-weight:700}
.eyebrow,.lbl{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted)}
section.view{display:grid;gap:16px;padding-top:18px}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%;min-width:0}
input.n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
input.sug,textarea.sug{color:var(--muted)}
input.edited{background:var(--accent-soft);border-color:var(--accent)}
.field{display:grid;gap:4px;align-content:start;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.panel>header{display:flex;gap:8px 12px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.panel>header .sum{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums}
.badge{font:600 11px var(--f-body);padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.csv{background:color-mix(in srgb,var(--t2) 14%,transparent);border-color:transparent;color:var(--ink)}
.badge.man{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.badge.borrador{} .badge.enviado{background:color-mix(in srgb,var(--t2) 15%,transparent);color:var(--ink);border-color:transparent}
.badge.aprobado{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ink);border-color:transparent}
.alert{border-radius:6px;padding:10px 12px;font-size:13px;background:color-mix(in srgb,var(--warn) 14%,transparent)}
.alert ul{margin:4px 0 0;padding-left:18px}
.empty{padding:36px 16px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);display:grid;gap:10px;justify-items:center}
.tbox{overflow-x:auto;min-width:0}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{font:600 10.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
table.t input.n{width:90px} table.t input.q{width:72px}
table.t tr.opt td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--panel2)}
.x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:15px;padding:3px 6px;border-radius:4px}
.x:hover{color:var(--err);background:var(--panel2)}
/* presupuesto */
.phead{display:grid;grid-template-columns:90px 80px minmax(0,2fr) minmax(0,1.3fr) minmax(0,1.3fr) 120px 130px;gap:10px}
@media (max-width:1000px){.phead{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stabs{display:flex;gap:4px;flex-wrap:wrap;align-items:flex-end;border-bottom:1px solid var(--line)}
.stabs button.st{background:none;border:1px solid transparent;border-bottom:0;border-radius:5px 5px 0 0;padding:7px 12px;font:600 13px var(--f-body);color:var(--muted);cursor:pointer;display:grid;gap:1px;text-align:left;margin-bottom:-1px}
.stabs button.st small{font:500 11.5px var(--f-mono)}
.stabs button.st[aria-current="true"]{border-color:var(--line);background:var(--panel);color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
.sbar{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
table.t tr.secrow td{background:var(--panel2);font-weight:700;font-family:var(--f-display)}
table.t tr.subt td{font-weight:600;border-top:1px solid var(--line)}
.combo-pop{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--muted);border-radius:6px;box-shadow:0 12px 30px rgba(0,0,0,.25);max-height:320px;overflow-y:auto;padding:4px;min-width:280px}
.combo-pop .op{display:flex;gap:10px;justify-content:space-between;padding:6px 8px;border-radius:4px;cursor:pointer;font-size:13px}
.combo-pop .op small{font-family:var(--f-mono);color:var(--muted);white-space:nowrap}
.combo-pop .op[aria-selected="true"]{background:var(--accent-soft)}
.combo-pop .vacio{padding:8px;color:var(--muted);font-size:13px}
input[data-combo]{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 8px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:24px}
.cotcard{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:8px}
.adj{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.adj a.th{display:block;width:96px;height:72px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--panel2);position:relative}
.adj a.th img{width:100%;height:100%;object-fit:cover;display:block}
.adj a.th span{position:absolute;inset:auto 0 0 0;font:600 10px var(--f-mono);background:var(--panel);padding:1px 4px;color:var(--ink)}
.mstrip{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.mchip{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:8px 12px;display:grid;gap:1px;cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:130px}
.mchip .c{font:800 15px var(--f-display)} .mchip .p{font:500 12.5px var(--f-mono);color:var(--muted)}
.mchip[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:8px 14px;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px;background:transparent}
.drop.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.medit{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1050px){.medit{grid-template-columns:1fr}}
.mmain{display:grid;gap:12px;min-width:0}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);display:grid;gap:12px}
@media (max-width:1050px){.side{position:static}}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13px}
.kv>span:nth-child(odd){color:var(--muted)} .kv>span:nth-child(even){font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.kv .sep{grid-column:1/-1;border-top:1px solid var(--line);margin:3px 0}
.kv .strong{color:var(--ink)!important;font-weight:700}
.big{font:800 30px var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.1}
.mhead{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:end}
@media (max-width:640px){.mhead{grid-template-columns:1fr}}
.gcard{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:8px;background:var(--panel)}
.gtop{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(4,minmax(0,1fr)) auto;gap:10px;align-items:end}
@media (max-width:900px){.gtop{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{display:grid;gap:1px} .stat b{font:700 16px var(--f-mono);font-variant-numeric:tabular-nums} .stat span{font-size:11.5px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.low i{background:var(--warn)}
.hint{font-size:12.5px;padding:6px 10px;border-radius:4px;background:var(--panel2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.boards figure{margin:0;display:grid;gap:4px} .boards svg{width:100%;height:auto;display:block}
.boards figcaption{font:500 12px var(--f-mono);color:var(--muted)}
.stepper{display:flex;align-items:stretch} .stepper input{border-radius:0;width:70px;text-align:center}
.stepper button{border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;padding:0 9px;font:700 14px var(--f-mono)}
.stepper button:first-child{border-radius:4px 0 0 4px;border-right:0} .stepper button:last-child{border-radius:0 4px 4px 0;border-left:0}
details.sec>summary{cursor:pointer;list-style:none;display:flex;gap:10px;justify-content:space-between;align-items:baseline}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h3::before{content:"▸ ";color:var(--muted)} details.sec[open]>summary h3::before{content:"▾ "}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.list{display:grid;gap:8px}
.pcard{display:grid;grid-template-columns:80px minmax(0,1fr) auto auto;gap:6px 14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.pcard:hover{border-color:var(--muted)}
.pcard .num{font:800 20px var(--f-display)} .pcard .t{font-weight:700} .pcard .s{color:var(--muted);font-size:12.5px} .pcard .tot{font:600 15px var(--f-mono)}
@media (max-width:640px){.pcard{grid-template-columns:60px minmax(0,1fr)}.pcard .tot,.pcard .badge{grid-column:2}}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,12,.55);display:grid;place-items:start center;padding:min(6vh,48px) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.dlg{background:var(--panel);color:var(--ink);border-radius:8px;width:min(560px,100%);display:grid;gap:14px;padding:18px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.35);min-width:0}
.dlg header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x-close{background:none;border:0;font-size:22px;color:var(--muted);cursor:pointer;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.cfgnav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.cfgnav button{background:none;border:1px solid transparent;border-radius:4px;padding:5px 10px;font:600 13px var(--f-body);color:var(--muted);cursor:pointer}
.cfgnav button[aria-selected="true"]{border-color:var(--line);background:var(--panel);color:var(--ink)}
.sumtable td.mono{white-space:nowrap}
.tag{font:600 10.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.tag.op{background:var(--accent-soft);color:var(--ink);border-color:transparent}

/* proyectos */
.prhead{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.apr-list{display:grid;gap:10px;max-height:min(56vh,560px);overflow:auto;padding-right:4px}
.apr-g{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;display:grid;gap:4px;margin:0;min-width:0}
.apr-g legend{font:700 12px var(--f-body);padding:0 4px}
.apr-o{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;cursor:pointer;padding:2px 0}
.apr-o .num{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.prcard{grid-template-columns:80px minmax(0,1fr) auto}
.avz{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:2px}
.av{display:inline-flex;align-items:center;gap:6px;font-size:11.5px}
.av .bar{width:64px;height:6px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;display:inline-block}
.av .bar i{display:block;height:100%;background:var(--ok)}
.pcard .av .num{font:500 11.5px var(--f-mono);color:var(--muted)}
#pr-ficha{scroll-margin-top:120px}
table.prt tr.sel td{background:var(--accent-soft)}
table.prt select.est{width:auto;min-width:128px;padding:3px 6px;font-size:12px}
select.est.e0{} select.est.e1{background:color-mix(in srgb,var(--t2) 12%,var(--panel))} select.est.e2{background:color-mix(in srgb,var(--warn) 18%,var(--panel))}
select.est.e3{background:color-mix(in srgb,var(--accent) 22%,var(--panel))} select.est.e4{background:color-mix(in srgb,var(--ok) 22%,var(--panel))}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px} .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.grid3,.grid4{grid-template-columns:minmax(0,1fr)}.grid3 .field{grid-column:auto!important}}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;font:600 12.5px var(--f-body);padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button[aria-pressed="true"].e2{background:var(--warn);color:#fff} .seg button[aria-pressed="true"].e4{background:var(--ok);color:#fff}
.chip{display:inline-flex;align-items:center;font:600 11.5px var(--f-body);padding:2px 9px;border-radius:99px;white-space:nowrap;border:1px solid transparent;background:var(--panel2);color:var(--muted)}
button.chip{cursor:pointer}
.chip.e1{background:color-mix(in srgb,var(--t2) 14%,var(--panel));color:var(--ink)} .chip.e2{background:color-mix(in srgb,var(--warn) 20%,var(--panel));color:var(--ink)}
.chip.e3{background:color-mix(in srgb,var(--accent) 26%,var(--panel));color:var(--ink)} .chip.e4{background:color-mix(in srgb,var(--ok) 22%,var(--panel));color:var(--ink)}
.pcard .avn{font:500 11.5px var(--f-mono);color:var(--muted)}
.mat{display:grid;gap:1px;min-width:180px} .mat span:first-child{font-weight:600}
.ficha{display:grid;gap:12px;scroll-margin-top:120px;border-left:3px solid var(--accent);padding-left:12px}
.fhead{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-end}
.csvdrop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;display:grid;gap:4px;justify-items:center;cursor:pointer;text-align:center}
.csvdrop:hover{border-color:var(--accent);background:var(--accent-soft)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px} .kpis>div{background:var(--panel2);border-radius:var(--r);padding:8px 10px;display:grid;gap:2px} .kpis b{font:700 18px var(--f-mono)}

<script>
/* Motor de optimización Mueler — guillotina por fases (tiras -> piezas -> recorte).
   Reproduce el criterio de Lepton Optimizer: primer corte en tiras, disco configurable,
   refilado horizontal/vertical, 2 o 3 fases, recortes de stock primero, fraccionamiento de la última placa. */
(function (root) {
  function expand(pieces) {
    const out = [];
    pieces.forEach((p, idx) => {
      for (let k = 0; k < p.cant; k++) out.push({ item: idx, n: k + 1, L: p.largo, A: p.ancho, rot: !!p.girar, desc: p.desc || '', cantos: p.cantos || {} });
    });
    return out;
  }
  function orients(it, transposed) {
    const a = transposed ? { w: it.A, h: it.L, r: false } : { w: it.L, h: it.A, r: false };
    const b = transposed ? { w: it.L, h: it.A, r: true } : { w: it.A, h: it.L, r: true };
    return it.rot && it.L !== it.A ? [a, b] : [a];
  }

  function packRun(items, W, H, k, opt) {
    const work = items.map(it => {
      const os = orients(it, opt.transposed).filter(o => o.w <= W + 1e-6 && o.h <= H + 1e-6);
      let pref = os[0];
      if (os.length > 1) {
        if (opt.orient === 'flat') pref = os.reduce((m, o) => (o.h < m.h ? o : m));
        else if (opt.orient === 'tall') pref = os.reduce((m, o) => (o.h > m.h ? o : m));
      }
      return { it, os, pref };
    });
    if (work.some(w => !w.os.length)) return null;
    const key = { h: w => [w.pref.h, w.pref.w], area: w => [w.pref.w * w.pref.h, w.pref.h], w: w => [w.pref.w, w.pref.h] }[opt.sort];
    work.sort((a, b) => { const ka = key(a), kb = key(b); return kb[0] - ka[0] || kb[1] - ka[1] || a.it.item - b.it.item; });
    const strips = [];
    for (const w of work) {
      let best = null;
      for (const s of strips) {
        for (const o of w.os) {
          if (o.h > s.h + 1e-6) continue;
          if (opt.stack) for (const c of s.cols) {
            if (o.w <= c.w + 1e-6 && c.used + k + o.h <= s.h + 1e-6) {
              const score = 0.5 * ((c.w - o.w) + (s.h - c.used - k - o.h) * 0.01);
              if (!best || score < best.score) best = { score, s, c, o };
            }
          }
          const need = (s.cols.length ? k : 0) + o.w;
          if (s.usedW + need <= W + 1e-6) {
            const score = (s.h - o.h) + 0.001 * o.w;
            if (!best || score < best.score) best = { score, s, c: null, o };
          }
        }
      }
      if (best) {
        if (best.c) { best.c.pieces.push({ ...best.o, it: w.it }); best.c.used += k + best.o.h; }
        else { best.s.usedW += (best.s.cols.length ? k : 0) + best.o.w; best.s.cols.push({ w: best.o.w, used: best.o.h, pieces: [{ ...best.o, it: w.it }] }); }
      } else {
        const o = w.pref;
        strips.push({ h: o.h, usedW: o.w, cols: [{ w: o.w, used: o.h, pieces: [{ ...o, it: w.it }] }] });
      }
    }
    strips.sort((a, b) => b.h - a.h || b.usedW - a.usedW);
    const boards = [];
    for (const s of strips) {
      let bb = null;
      for (const b of boards) {
        const need = (b.strips.length ? k : 0) + s.h;
        if (b.usedH + need <= H + 1e-6 && (!bb || b.usedH > bb.usedH)) bb = b;
      }
      if (!bb) { bb = { usedH: 0, strips: [] }; boards.push(bb); }
      bb.usedH += (bb.strips.length ? k : 0) + s.h;
      bb.strips.push(s);
    }
    return boards;
  }

  function layout(board, W, H, k, offX, offY, transposed, minRet) {
    const P = [], R = [], C = [];
    let y = 0, maxX = 0;
    board.strips.forEach(s => {
      let x = 0;
      s.cols.forEach(c => {
        let yy = y;
        c.pieces.forEach((p, pi) => {
          P.push({ x, y: yy, w: p.w, h: p.h, it: p.it });
          if (c.w - p.w > 0.5) { R.push({ x: x + p.w + k, y: yy, w: c.w - p.w - k, h: p.h }); C.push({ st: 3, x1: x + p.w, y1: yy, x2: x + p.w, y2: yy + p.h }); }
          yy += p.h;
          if (pi < c.pieces.length - 1 || s.h - (yy - y) > 0.5) C.push({ st: 3, x1: x, y1: yy, x2: x + c.w, y2: yy });
          yy += k;
        });
        const top = s.h - c.used;
        if (top > k + 0.5) R.push({ x, y: y + c.used + k, w: c.w, h: top - k });
        x += c.w;
        if (W - x > 0.5) C.push({ st: 2, x1: x, y1: y, x2: x, y2: y + s.h });
        x += k;
      });
      maxX = Math.max(maxX, x - k);
      if (W - x > 0.5) R.push({ x, y, w: W - x, h: s.h });
      y += s.h;
      if (H - y > 0.5) C.push({ st: 1, x1: 0, y1: y, x2: W, y2: y });
      y += k;
    });
    const usedH = y - k;
    if (H - y > 0.5) R.push({ x: 0, y, w: W, h: H - y });
    const tr = o => transposed ? { ...o, x: o.y, y: o.x, w: o.h, h: o.w } : o;
    const tc = c => transposed ? { st: c.st, x1: c.y1, y1: c.x1, x2: c.y2, y2: c.x2 } : c;
    const off = o => ({ ...o, x: o.x + offX, y: o.y + offY });
    const offc = c => ({ ...c, x1: c.x1 + offX, x2: c.x2 + offX, y1: c.y1 + offY, y2: c.y2 + offY });
    const pieces = P.map(tr).map(off).map((p, i) => ({ ...p, seq: i + 1, rotated: p.w !== p.it.L || (p.it.L === p.it.A ? false : false) }));
    pieces.forEach(p => { p.rotated = Math.abs(p.w - p.it.L) > 1e-6; });
    const rests = R.filter(r => r.w > 0.5 && r.h > 0.5).map(tr).map(off).map(r => ({ ...r, util: Math.min(r.w, r.h) >= minRet }))
      .sort((a, b) => b.w * b.h - a.w * a.h).map((r, i) => ({ ...r, id: 's' + (i + 1) }));
    const cuts = C.map(tc).map(offc).sort((a, b) => a.st - b.st);
    const mlSierra = cuts.reduce((s, c) => s + Math.hypot(c.x2 - c.x1, c.y2 - c.y1), 0) / 1000;
    // extensión ocupada (para fraccionamiento): en coordenadas de placa
    const ext = transposed ? { x: usedH, y: maxX } : { x: maxX, y: usedH };
    return { pieces, rests, cuts, mlSierra, usedArea: pieces.reduce((s, p) => s + p.w * p.h, 0), ext };
  }

  const STRATS = [];
  ['flat', 'tall', 'free'].forEach(o => ['h', 'area', 'w'].forEach(s => STRATS.push({ orient: o, sort: s })));

  function bestPack(items, W0, H0, cfg) {
    const dirs = cfg.dir === 'auto' ? [false, true] : [cfg.dir === 'V'];
    let best = null;
    for (const transposed of dirs) {
      const W = transposed ? H0 : W0, H = transposed ? W0 : H0;
      for (const st of STRATS) {
        const boards = packRun(items, W, H, cfg.kerf, { transposed, orient: st.orient, sort: st.sort, stack: cfg.fases !== 2 });
        if (!boards) continue;
        const lastUsed = boards[boards.length - 1].usedH / H;
        const score = boards.length * 1000 + lastUsed * 100 + (transposed ? 0.5 : 0);
        if (!best || score < best.score) best = { score, boards, transposed, W, H, ...st };
      }
    }
    return best;
  }

  // Recorte de stock: llena un retazo con el mejor subconjunto que la heurística encuentra
  function fillOffcut(items, rw, rh, cfg) {
    const fits = items.filter(it => orients(it, false).some(o => o.w <= rw && o.h <= rh) || orients(it, true).some(o => o.w <= rh && o.h <= rw));
    if (!fits.length) return null;
    let best = null;
    const dirs = cfg.dir === 'auto' ? [false, true] : [cfg.dir === 'V'];
    for (const transposed of dirs) {
      const W = transposed ? rh : rw, H = transposed ? rw : rh;
      for (const st of STRATS) {
        const fitsHere = fits.filter(it => orients(it, transposed).some(o => o.w <= W + 1e-6 && o.h <= H + 1e-6));
        if (!fitsHere.length) continue;
        const boards = packRun(fitsHere, W, H, cfg.kerf, { transposed, orient: st.orient, sort: st.sort, stack: cfg.fases !== 2 });
        if (!boards || !boards.length) continue;
        const b = boards[0];
        const area = b.strips.reduce((s, x) => s + x.cols.reduce((t, c) => t + c.pieces.reduce((u, p) => u + p.w * p.h, 0), 0), 0);
        if (!best || area > best.area) best = { area, board: b, transposed, W, H };
      }
    }
    return best;
  }

  const FRACS = [
    { k: '1/4 horizontal', fx: 1, fy: 1 / 4, flag: 'F_1_4_H' }, { k: '1/3 horizontal', fx: 1, fy: 1 / 3, flag: 'F_1_3_H' },
    { k: '1/2 horizontal', fx: 1, fy: 1 / 2, flag: 'F_1_2_H' }, { k: '2/3 horizontal', fx: 1, fy: 2 / 3, flag: 'F_2_3_H' }, { k: '3/4 horizontal', fx: 1, fy: 3 / 4, flag: 'F_3_4_H' },
    { k: '1/4 vertical', fx: 1 / 4, fy: 1, flag: 'F_1_4_V' }, { k: '1/3 vertical', fx: 1 / 3, fy: 1, flag: 'F_1_3_V' },
    { k: '1/2 vertical', fx: 1 / 2, fy: 1, flag: 'F_1_2_V' }, { k: '2/3 vertical', fx: 2 / 3, fy: 1, flag: 'F_2_3_V' }, { k: '3/4 vertical', fx: 3 / 4, fy: 1, flag: 'F_3_4_V' },
    { k: '1/4 cruz', fx: 1 / 2, fy: 1 / 2, flag: 'F_1_4_C' },
  ];

  function optimize(input) {
    const cfg = Object.assign({ kerf: 4.4, refX: 4.5, refY: 4.5, ref4: true, retazoMin: 100, despCanto: 44, despCantoPct: 0, dir: 'auto', fases: 3, apila: 1, fracciones: [], redondeo: 'arriba', ocultarT2: false }, input.cfg || {});
    if (cfg.ref !== undefined && input.cfg && input.cfg.refX === undefined) { cfg.refX = cfg.ref; cfg.refY = cfg.ref; }
    const L = input.placa.largo, A = input.placa.ancho;
    const nX = cfg.ref4 ? 2 : 1;
    const W0 = L - nX * cfg.refX, H0 = A - nX * cfg.refY;
    let items = expand(input.pieces);
    const all = items.slice();
    const placas = [];
    // 1) recortes de stock primero
    (input.recortes || []).forEach(rc => {
      for (let q = 0; q < (rc.cant || 1); q++) {
        if (!items.length) return;
        const rw = rc.largo - nX * cfg.refX, rh = rc.ancho - nX * cfg.refY;
        const f = fillOffcut(items, rw, rh, cfg);
        if (!f) return;
        const lay = layout(f.board, f.W, f.H, cfg.kerf, cfg.refX, cfg.refY, f.transposed, cfg.retazoMin);
        const used = new Set(lay.pieces.map(p => p.it));
        items = items.filter(it => !used.has(it));
        placas.push({ ...lay, placa: { largo: rc.largo, ancho: rc.ancho, recorte: true, desc: rc.desc || 'Recorte de stock' }, W: rw, H: rh });
      }
    });
    // 2) placas enteras
    let best = null;
    if (items.length) {
      best = bestPack(items, W0, H0, cfg);
      if (!best) return { error: 'Alguna pieza no entra en la placa.' };
      best.boards.forEach(b => placas.push({ ...layout(b, best.W, best.H, cfg.kerf, cfg.refX, cfg.refY, best.transposed, cfg.retazoMin), placa: { largo: L, ancho: A, recorte: false }, W: W0, H: H0 }));
    }
    // fraccionamiento de la última placa entera
    let fraccion = null;
    const enteras = placas.filter(p => !p.placa.recorte);
    if (enteras.length && cfg.fracciones && cfg.fracciones.length) {
      const last = enteras[enteras.length - 1];
      const needX = last.ext.x + cfg.refX + cfg.kerf, needY = last.ext.y + cfg.refY + cfg.kerf;
      const cands = FRACS.filter(f => cfg.fracciones.includes(f.flag)).filter(f => L * f.fx >= needX - 1e-6 && A * f.fy >= needY - 1e-6)
        .sort((a, b) => a.fx * a.fy - b.fx * b.fy);
      if (cands.length && cands[0].fx * cands[0].fy < 1) fraccion = { nombre: cands[0].k, factor: cands[0].fx * cands[0].fy };
    }
    // agrupar placas idénticas (mismo patrón)
    const groups = [];
    placas.forEach(p => {
      const sig = (p.placa.recorte ? 'R' + p.placa.largo + 'x' + p.placa.ancho + '|' : '') + p.pieces.map(q => [q.it.item, q.x.toFixed(1), q.y.toFixed(1)].join(':')).join('|');
      const g = groups.find(g => g.sig === sig && !p.placa.recorte);
      if (g) g.cantidad++; else groups.push({ ...p, sig, cantidad: 1 });
    });
    groups.forEach((g, i) => { g.n = i + 1; });
    // totales
    const nEnteras = enteras.length;
    const m2Placa = L * A / 1e6;
    const m2Total = m2Placa * nEnteras + placas.filter(p => p.placa.recorte).reduce((s, p) => s + p.placa.largo * p.placa.ancho / 1e6, 0);
    const m2Cortado = all.reduce((s, it) => s + it.L * it.A, 0) / 1e6;
    const tap = [0, 0, 0], lados = [0, 0, 0], pegado = [0, 0, 0];
    all.forEach(it => {
      const c = it.cantos;
      [['sup', it.L], ['inf', it.L], ['izq', it.A], ['der', it.A]].forEach(([k2, len]) => {
        let t = c[k2] | 0; if (t === 2 && cfg.ocultarT2) t = 1;
        if (t) { pegado[t] += len; tap[t] += len * (1 + (cfg.despCantoPct || 0) / 100) + cfg.despCanto; lados[t]++; }
      });
    });
    const rnd = v => cfg.redondeo === 'abajo' ? Math.floor(v + 1e-9) : cfg.redondeo === 'cercano' ? Math.round(v) : Math.ceil(v - 1e-9);
    const cortes = groups.reduce((s, g) => s + g.cuts.length * g.cantidad, 0);

let RESTORING = false;

function combo(path, val, src, o = {}) {
  const id = 'k-' + path.replace(/[^\w]/g, '-');
  return `<input type="text" id="${id}" data-k="${esc(path)}" data-combo="${src}" data-val="${esc(val || '')}" value="${esc(val || '')}" placeholder="${esc(o.ph || 'Escribí para buscar')}" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="combo-pop" aria-autocomplete="list" aria-label="${esc(o.label || path)}">`;

const CB = { el: null, items: [], act: 0 };
function cbOpen(el, q) { CB.el = el; cbFilter(q || ''); el.setAttribute('aria-expanded', 'true'); }
function cbFilter(q) {
  const ws = norm(q).split(/\s+/).filter(Boolean);

function cbDraw() {
  const p = $('combo-pop');
  p.innerHTML = CB.items.length ? CB.items.map((x, k) => `<div class="op" role="option" id="cbo-${k}" data-k="${k}" aria-selected="${k === CB.act}"><span>${esc(x.v)}</span><small>${esc(x.d || '')}</small></div>`).join('')

}
function cbPos() {
  if (!CB.el) return; const r = CB.el.getBoundingClientRect(), p = $('combo-pop');
  const w = Math.min(Math.max(r.width, 360), window.innerWidth - 16); p.style.width = w + 'px';
  p.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
  const below = window.innerHeight - r.bottom;
  if (below < 240 && r.top > below) { p.style.top = ''; p.style.bottom = (window.innerHeight - r.top + 2) + 'px'; } else { p.style.bottom = ''; p.style.top = (r.bottom + 2) + 'px'; }

function cbClose() { $('combo-pop').hidden = true; if (CB.el) CB.el.setAttribute('aria-expanded', 'false'); CB.el = null; }
function cbSet(el, v) { const ch = v !== (el.dataset.val || ''); el.value = v; cbClose(); if (ch) el.dispatchEvent(new Event('change', { bubbles: true })); }

document.addEventListener('focusin', e => { const t = e.target; if (RESTORING || !t.dataset || !t.dataset.combo) return; cbOpen(t); try { t.select(); } catch (er) { } });
document.addEventListener('input', e => { const t = e.target; if (!(t.dataset && t.dataset.combo)) return; if (CB.el !== t) cbOpen(t, t.value); else cbFilter(t.value); }, true);
document.addEventListener('mousedown', e => { const t = e.target; if (t.dataset && t.dataset.combo && CB.el !== t && document.activeElement === t) cbOpen(t); }, true);
document.addEventListener('keydown', e => {
  const t = e.target; if (!(t.dataset && t.dataset.combo)) return;
  if (CB.el !== t) { if (e.key === 'ArrowDown') { e.preventDefault(); cbOpen(t); } return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); CB.act = Math.min(CB.items.length - 1, CB.act + 1); cbDraw(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); CB.act = Math.max(0, CB.act - 1); cbDraw(); }

function SheetDB(url, key, pref) {

    set: async d => { await call({ op: 'set', coll, id, data: JSON.parse(JSON.stringify(d)) }); pollSoon(); },
    delete: async () => { await call({ op: 'del', coll, id }); pollSoon(); } });
  const P = c => pref + c;

    doc: p => { const k = p.split('/'); return ref(P(k[0]), k[1]); },
    collection: c => { const q = { coll: P(c), ob: null, dir: 'asc', lim: 1000, wh: null };
      const api = { doc: id => ref(q.coll, id), orderBy: (f, d) => { q.ob = f; q.dir = d || 'asc'; return api; }, limit: n => { q.lim = n; return api; },
        where: (f, op, v) => { q.wh = [f, v]; return api; },
        get: async () => { const j = await call({ op: 'list', coll: q.coll, orderBy: q.ob, dir: q.dir, limit: q.lim }); const it = q.wh ? j.items.filter(x => x.data && x.data[q.wh[0]] === q.wh[1]) : j.items; return { docs: it.map(x => ({ id: x.id, exists: true, data: () => x.data })) }; },
        onSnapshot: (cb, err) => { const L = Object.assign({}, q, { cb, err }); subs.push(L); poll(); if (!pollT) pollT = setInterval(poll, 30000); return () => { subs.splice(subs.indexOf(L), 1); }; } };
      return api; } };
}

/* ---------------- Copia de seguridad (bajar / subir todos los datos) ---------------- */
const COLS_SIS = ['presupuestos', 'muebles', 'proyectos', 'pedidos', 'fichas', 'stock'];
async function exportarDatos() {
  if (!DB) { toast('No hay base conectada.'); return; }
  toast('Juntando los datos…'); const out = { formato: 'mueler-sistema-backup-1', fecha: new Date().toISOString(), colecciones: {}, config: {} };
  try {
    for (const c of COLS_SIS) { const s = await DB.collection(c).limit(5000).get(); out.colecciones[c] = s.docs.map(d => Object.assign({ id: d.id }, d.data())); }
    for (const id of ['taller', 'listas']) { try { const s = await DB.doc('config/' + id).get(); if (s.exists) out.config[id] = s.data(); } catch (e) { } }
  } catch (e) { console.error(e); toast('No se pudieron leer los datos.'); return; }
  const n = Object.values(out.colecciones).reduce((a, x) => a + x.length, 0);
  await offer(`Mueler_Sistema_datos_${today().replace(/\//g, '-')}.json`, JSON.stringify(out));
  toast(`Copia lista: ${n} documentos.`);
}
const fImp = document.createElement('input'); fImp.type = 'file'; fImp.accept = '.json'; fImp.hidden = true; document.body.appendChild(fImp);
fImp.addEventListener('change', async () => {
  const f = fImp.files[0]; fImp.value = ''; if (!f) return; let j;
  try { j = JSON.parse(await f.text()); } catch (e) { toast('El archivo no es una copia del Sistema.'); return; }
  if (!j || j.formato !== 'mueler-sistema-backup-1') { toast('El archivo no es una copia del Sistema.'); return; }
  if (!DB) { toast('No hay base conectada: entrá con la clave del taller.'); return; }
  const cnt = COLS_SIS.map(c => `${(j.colecciones[c] || []).length} ${c}`).join(' · ');
  confirmDlg('Subir copia de seguridad', `Se cargan ${cnt}. Los documentos con el mismo código se reemplazan; los demás no se tocan.`, 'Subir', async () => {
    let n = 0, tot = COLS_SIS.reduce((a, c) => a + (j.colecciones[c] || []).length, 0);
    try {
      for (const c of COLS_SIS) for (const d of (j.colecciones[c] || [])) { const { id, ...rest } = d; await DB.collection(c).doc(id).set(rest); n++; if (n % 5 === 0) toast(`Subiendo… ${n} de ${tot}`); }
      for (const [id, d] of Object.entries(j.config || {})) await DB.doc('config/' + id).set(d);
      toast(`Listo: ${n} documentos cargados. Recargá la página.`);
    } catch (e) { console.error(e); toast(`Se cortó en ${n} de ${tot}. Volvé a subir el archivo para completar.`); }
  });
});
function backupDlg() {
  const d = modal(`${H('Copia de seguridad')}<p class="note" style="margin:0">Baja o sube todos los datos del Sistema: presupuestos, proyectos, fichas, pedidos y stock. Sirve para pasar los datos entre la versión de claude.ai y la web del taller.</p>
    <p class="note" style="margin:0">Base actual: <b>${EN_CLAUDE() ? 'claude.ai' : (DB ? 'web del taller (Google)' : 'solo este navegador')}</b></p>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-bk="sub">Subir copia…</button><button class="btn primary" data-bk="baj">Bajar copia</button></div>`);
  d.m.addEventListener('click', e => { const b = e.target.closest('[data-bk]'); if (!b) return; d.close(); if (b.dataset.bk === 'baj') exportarDatos(); else fImp.click(); });
}

  const cods = X.S.rows.filter(r => !r.opcion).map(r => r.sector + '|' + r.M.cod); const rep = cods.filter((x, i) => cods.indexOf(x) !== i);
  if (rep.length) av.push('Hay códigos repetidos dentro de un mismo sector: ' + [...new Set(rep.map(x => x.split('|')[1]))].join(', '));
  return av;
}
const LEYENDA_LED = 'La instalación de tira leds incluye instalación de leds, fuente e interruptor en el mueble (de aclararse en este mismo presupuesto). Para su instalación deben estar provistos los cables con tensión y de ser necesario al interruptor llave de punto. No incluye otro tipo de trabajo de electricidad ni albañilería que no esté aclarado.';
