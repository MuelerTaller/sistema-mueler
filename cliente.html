<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Presupuesto · Mueler Taller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#f3f3ef;--panel:#fff;--ink:#1b211e;--muted:#646c67;--line:#dcdfd8;--accent:#e8a400;--soft:#fbf1d6;--ok:#2d7a4b;
  --f:"Archivo","Helvetica Neue",Arial,sans-serif;--m:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f);padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{background:var(--panel);border-bottom:1px solid var(--line);padding:18px 0 14px}
header.top .wrap{display:grid;gap:10px}
.logo{height:46px;width:auto;display:block}
h1{font-size:20px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px}
.intro{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:14px;margin:16px 0 4px}
h2.sec{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.mue{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px;display:grid;gap:10px}
.mh{display:flex;gap:10px;align-items:baseline}
.mh b{font:800 15px var(--f);background:var(--ink);color:#fff;border-radius:5px;padding:1px 7px}
.mh span{font-weight:700;font-size:15.5px}
.det{font-size:13px;color:var(--muted);display:grid;gap:2px}
.det i{font-style:normal;color:var(--ink)}
.lbl{font:700 11px var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:-4px}
.ch{display:grid;gap:6px}
.opt{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--panel);-webkit-tap-highlight-color:transparent}
.opt input{width:20px;height:20px;margin:0;accent-color:var(--ink)}
.opt .n{font-weight:600;font-size:14.5px}
.opt .p{font:600 14px var(--m);white-space:nowrap;text-align:right}
.opt .p small{display:block;font:500 11.5px var(--f);color:var(--muted)}
.opt:has(input:checked){border-color:var(--ink);background:var(--soft)}
.sol{display:flex;justify-content:space-between;font:600 14px var(--m)}
.cond{font-size:12.5px;color:var(--muted);margin:26px 0 8px}
.cond ul{padding-left:18px;margin:6px 0}
.pie{font-size:12px;color:var(--muted);text-align:center;margin:18px 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(0,0,0,.18);z-index:10}
.bar .wrap{display:grid;gap:8px}
.tots{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13.5px}
.tots span:nth-child(even){font-family:var(--m);text-align:right}
.tots .big{font-weight:800;font-size:17px}
.tots .big+span{font-size:18px;font-weight:600;color:var(--accent)}
.tots .bn{color:#9fd6b2}
.tots .as{grid-column:1/-1;text-align:left!important;font:500 13px var(--f)!important;color:#d9ddd8}.tots .as b{font:600 13px var(--m);color:#fff}
.btns{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:8px;padding:11px 12px;font:700 14.5px var(--f);cursor:pointer;text-align:center;text-decoration:none}
.btn.wa{background:#25d366;color:#08301a}
.btn.sec{background:rgba(255,255,255,.12);color:#fff;flex:0 0 auto}
.err{max-width:520px;margin:60px auto;padding:20px;background:var(--panel);border-radius:10px;border:1px solid var(--line);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;font-weight:600;z-index:20}
[hidden]{display:none!important}
@media print{.bar,.btns,.toast{display:none!important}body{padding:0}}
</style>
</head>

<div id="app"></div>

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const N = v => +v || 0;
const money = n => '$ ' + Math.round(N(n)).toLocaleString('es-AR');
function toast(t) { const e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => e.hidden = true, 2200); }
async function leer() {
  const h = location.hash.replace(/^#/, ''); const m = h.match(/(?:^|&)d=([^&]+)/); if (!m) throw new Error('sin datos');
  const raw = m[1]; const tipo = raw[0]; const b64 = raw.slice(1).replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '==='.slice((b64.length + 3) % 4)); const u8 = Uint8Array.from(bin, c => c.charCodeAt(0));
  let txt;
  if (tipo === 'z') { const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate')); txt = await new Response(s).text(); }
  else txt = new TextDecoder().decode(u8);
  return JSON.parse(txt);
}
let D, SEL = {};
function totales() {
  let t = 0, cambio = false; const el = [];
  D.sec.forEach((s, si) => s.m.forEach((m, mi) => {
    const k = si + '.' + mi, f = SEL[k] ? SEL[k].f : 0; t += N(m.fr[f].v); if (f) cambio = true;
    el.push({ m, f: m.fr[f], ops: m.op.filter((o, oi) => SEL[k] && SEL[k].o[oi]) });
    m.op.forEach((o, oi) => { if (SEL[k] && SEL[k].o[oi]) { t += N(o.v); cambio = true; } });
  }));
  let bn = 0; const B = D.bon;
  if (B) bn = B.modo === 'monto' ? Math.round(N(cambio && B.montoOp !== '' && B.montoOp != null ? B.montoOp : B.monto)) : Math.round(t * N(B.pct) / 100);
  const fin = t - bn, ad = Math.round(fin * N(D.pct) / 100);
  return { t, bn, fin, ad, sal: fin - ad, el };
}
function pintarTot() {
  const T = totales(), B = D.bon;
  $('tots').innerHTML = (T.bn ? `<span>Subtotal</span><span>${money(T.t)}</span><span class="bn">${esc(B.label || 'Bonificación')}</span><span class="bn">− ${money(T.bn)}</span>` : '') +
    `<span class="big">Total</span><span>${money(T.fin)}</span>` + (D.pct ? `<span class="as">Adelanto ${N(D.pct)}% <b>${money(T.ad)}</b> · Saldo ${100 - N(D.pct)}% <b>${money(T.sal)}</b></span>` : '');
}
function textoWA() {
  const T = totales(); const L = [`Hola! Elegí estas opciones del ${D.tit}:`];

  if (T.bn) L.push(`${D.bon.label || 'Bonificación'}: −${money(T.bn)}`);

      ${m.fr.length > 1 ? `<div class="lbl">Frente</div><div class="ch">${m.fr.map((f, fi) => `<label class="opt"><input type="radio" name="f${k}" data-k="${k}" data-f="${fi}" ${fi === 0 ? 'checked' : ''}><span class="n">${esc(f.n)}</span><span class="p">${money(f.v)}${fi ? `<small>+ ${money(f.v - m.fr[0].v)}</small>` : ''}</span></label>`).join('')}</div>`
        : `<div class="sol"><span>${esc(m.fr[0].n || 'Frentes')}</span><span>${money(m.fr[0].v)}</span></div>`}
      ${m.op.length ? `<div class="lbl">Opciones</div><div class="ch">${m.op.map((o, oi) => `<label class="opt"><input type="checkbox" data-k="${k}" data-o="${oi}"><span class="n">${esc(o.n)}</span><span class="p">+ ${money(o.v)}</span></label>`).join('')}</div>` : ''}
      </section>`; }).join('')}`).join('')}
    <div class="cond"><b>Condiciones comerciales</b><ul>${(D.cond || []).map(c => `<li>${esc(c)}</li>`).join('')}</ul>Flete e instalación incluidos.</div>
    <div class="pie">${esc(D.pie || 'Mueler Taller')}</div>
  </main>
  <div class="bar"><div class="wrap"><div class="tots" id="tots"></div><div class="btns"><a class="btn wa" id="b-wa" href="#" target="_blank" rel="noopener">Confirmar por WhatsApp</a><button class="btn sec" id="b-cp" type="button">Copiar</button></div></div></div>`;
  D.sec.forEach((s, si) => s.m.forEach((m, mi) => { SEL[si + '.' + mi] = { f: 0, o: {} }; }));
  app.addEventListener('change', e => { const x = e.target; const k = x.dataset.k; if (!k) return;
    if (x.dataset.f != null) SEL[k].f = +x.dataset.f; if (x.dataset.o != null) SEL[k].o[+x.dataset.o] = x.checked; pintarTot(); });
  $('b-wa').addEventListener('click', e => { e.currentTarget.href = 'https://wa.me/' + (D.wa || '') + '?text=' + encodeURIComponent(textoWA()); });
  $('b-cp').addEventListener('click', async () => { try { await navigator.clipboard.writeText(textoWA()); toast('Copiado'); } catch (er) { toast('No se pudo copiar'); } });
  document.title = D.tit + ' · Mueler Taller';
  pintarTot();
}
leer().then(d => { D = d; render(); }).catch(() => { $('app').innerHTML = `<div class="err"><img class="logo" src="${LOGO}" alt="Mueler Taller" style="margin:0 auto 12px"><b>No se pudo abrir el presupuesto.</b><p class="sub">El link está incompleto. Pedile a Mueler Taller que te lo reenvíe.</p></div>`; });
</script>
</body>
</html>
